[project]
name = "safco-agent"
version = "0.1.0"
description = "Agent-based product scraper for Safco Dental Supply (take-home POC)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "playwright>=1.55",
    "pydantic>=2.8",
    "tenacity>=9.0",
    "structlog>=24.4",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "openai>=1.50",
    "openpyxl>=3.1",
]

[project.scripts]
safco-agent = "safco_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safco_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
